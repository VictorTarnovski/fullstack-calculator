version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calculator-backend
    ports:
      - "8080:8080"
    environment:
      CALCULATOR_ADDR: ":8080"
      CALCULATOR_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://frontend"
    networks:
      - calculator-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calculator-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - calculator-network
    restart: unless-stopped

networks:
  calculator-network:
    driver: bridge
